[package]
name = "gh-inbox"
version = "0.1.0"
edition = "2024"

[dependencies]
# runtime_shaders: compile Metal shaders at launch, so the build needs only the
# Command Line Tools, not Xcode's metal compiler.
gpui = { version = "0.2", features = ["runtime_shaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[target."cfg(unix)".dependencies]
libc = "0.2"
